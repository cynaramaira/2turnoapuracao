<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º Turno Presidencial 2026 — Jamildo.com</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --laranja: #f83d03;
            --laranja-glow: rgba(248, 61, 3, 0.25);
            --azul: #024796;
            --azul-glow: rgba(2, 71, 150, 0.25);
            --escuro: #0a0f1e;
            --escuro-2: #111827;
            --escuro-3: #1c2535;
            --borda: rgba(255,255,255,0.08);
            --texto: #e8eaf0;
            --texto-suave: #8892a4;
            --verde-eleito: #10b981;
            --fonte-display: 'Barlow Condensed', sans-serif;
            --fonte-corpo: 'Barlow', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--fonte-corpo);
            background-color: var(--escuro);
            color: var(--texto);
            padding: 12px;
        }

        .painel-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 1. SELETOR VISUAL DE REGIÕES */
        .regioes-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .regioes-bar::-webkit-scrollbar { display: none; }

        .btn-regiao {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .btn-regiao:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .btn-regiao.ativa {
            background: var(--laranja);
            border-color: var(--laranja);
            color: #fff;
            box-shadow: 0 2px 10px var(--laranja-glow);
        }

        /* 2. CHIPS DE ESTADOS (UFS) */
        .estados-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .estados-label {
            font-family: var(--fonte-display);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-right: 4px;
        }
        .btn-uf {
            background: var(--escuro-3);
            border: 1px solid var(--borda);
            color: #fff;
            font-family: var(--fonte-display);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-uf:hover { border-color: #fff; }
        .btn-uf.ativa {
            background: var(--azul);
            border-color: var(--azul);
            box-shadow: 0 2px 8px var(--azul-glow);
        }

        /* 3. TOTALIZAÇÃO */
        .totalizacao-box {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .tot-dado { text-align: left; }
        .tot-label {
            font-family: var(--fonte-display);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--texto-suave);
        }
        .tot-valor {
            font-family: var(--fonte-display);
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }
        .tot-valor.destaque { color: var(--laranja); }

        /* 4. CARDS DOS FINALISTAS */
        .grid-finalistas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .card-finalista {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .card-finalista:first-child { border-top: 4px solid var(--laranja); }
        .card-finalista:last-child { border-top: 4px solid var(--azul); }

        .perfil-topo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .foto-finalista {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .nome-finalista {
            font-family: var(--fonte-display);
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .tag-partido {
            font-size: 0.72rem;
            color: var(--texto-suave);
            margin-top: 2px;
            display: block;
        }

        .selo-status {
            display: inline-block;
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            margin-top: 4px;
        }
        .selo-status.eleito { background-color: var(--verde-eleito); }

        .bloco-votos { margin-top: auto; }
        .pct-votos {
            font-family: var(--fonte-display);
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
        }
        .abs-votos {
            font-size: 0.78rem;
            color: var(--texto-suave);
            margin-top: 3px;
        }

        .barra-wrap {
            height: 5px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .barra-fill {
            height: 100%;
            transition: width 1s ease;
        }
        .card-finalista:first-child .barra-fill { background: var(--laranja); }
        .card-finalista:last-child .barra-fill { background: var(--azul); }

        /* 5. BOX REGIONAL INFORMATIVO */
        .info-regional-card {
            background: linear-gradient(180deg, rgba(28, 37, 53, 0.4) 0%, rgba(17, 24, 39, 0.6) 100%);
            border: 1px dashed var(--borda);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--texto-suave);
        }
        .badge-local-ativo {
            color: #fff;
            font-weight: 700;
            font-family: var(--fonte-display);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 600px) {
            .grid-finalistas { grid-template-columns: 1fr; }
            .totalizacao-box {
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }
            .tot-dado { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="painel-container">
        
        <!-- Pílulas de Regiões -->
        <div class="regioes-bar">
            <button class="btn-regiao ativa" onclick="selecionarRegiao('BR')">🇧🇷 Brasil</button>
            <button class="btn-regiao" onclick="selecionarRegiao('NE')">Nordeste</button>
            <button class="btn-regiao" onclick="selecionarRegiao('SE')">Sudeste</button>
            <button class="btn-regiao" onclick="selecionarRegiao('SUL')">Sul</button>
            <button class="btn-regiao" onclick="selecionarRegiao('CO')">Centro-Oeste</button>
            <button class="btn-regiao" onclick="selecionarRegiao('NORTE')">Norte</button>
        </div>

        <!-- Grade de Estados da Região Ativa -->
        <div class="estados-grid" id="container-estados">
            <span class="estados-label">Unidade:</span>
            <button class="btn-uf ativa" onclick="mudarUF('br', 'Brasil (Consolidado)')">Total Brasil</button>
        </div>

        <!-- Barra de Status e Horário -->
        <div class="totalizacao-box">
            <div class="tot-dado">
                <div class="tot-label">Seções Apuradas (<span id="txt-local">Brasil</span>)</div>
                <div class="tot-valor destaque" id="pct-apurado">0,00%</div>
            </div>
            <div class="tot-dado" style="text-align: right;">
                <div class="tot-label">Horário Oficial TSE</div>
                <div class="tot-valor" id="hora-tse">00:00:00</div>
            </div>
        </div>

        <!-- Dois Finalistas -->
        <div class="grid-finalistas" id="container-finalistas">
            <!-- Renderizado dinamicamente -->
        </div>

        <!-- Bloco Informativo de Apoio -->
        <div class="info-regional-card">
            <span>Local em exibição: <strong class="badge-local-ativo" id="info-local-texto">Brasil (Geral)</strong></span>
            <span id="info-status-urnas">Aguardando urnas</span>
        </div>

    </div>

    <script>
        const WORKER_2T_URL = "https://tse-proxy-2t.cynaramaira.workers.dev/";
        let ufAtiva = "br";

        const DADOS_REGIOES = {
            'BR': [
                { sigla: 'br', nome: 'Total Brasil' }
            ],
            'NE': [
                { sigla: 'pe', nome: 'Pernambuco' },
                { sigla: 'ba', nome: 'Bahia' },
                { sigla: 'ce', nome: 'Ceará' },
                { sigla: 'ma', nome: 'Maranhão' },
                { sigla: 'pb', nome: 'Paraíba' },
                { sigla: 'al', nome: 'Alagoas' },
                { sigla: 'rn', nome: 'Rio Grande do Norte' },
                { sigla: 'pi', nome: 'Piauí' },
                { sigla: 'se', nome: 'Sergipe' }
            ],
            'SE': [
                { sigla: 'sp', nome: 'São Paulo' },
                { sigla: 'rj', nome: 'Rio de Janeiro' },
                { sigla: 'mg', nome: 'Minas Gerais' },
                { sigla: 'es', nome: 'Espírito Santo' }
            ],
            'SUL': [
                { sigla: 'pr', nome: 'Paraná' },
                { sigla: 'rs', nome: 'Rio Grande do Sul' },
                { sigla: 'sc', nome: 'Santa Catarina' }
            ],
            'CO': [
                { sigla: 'df', nome: 'Distrito Federal' },
                { sigla: 'go', nome: 'Goiás' },
                { sigla: 'mt', nome: 'Mato Grosso' },
                { sigla: 'ms', nome: 'Mato Grosso do Sul' }
            ],
            'NORTE': [
                { sigla: 'am', nome: 'Amazonas' },
                { sigla: 'pa', nome: 'Pará' },
                { sigla: 'ac', nome: 'Acre' },
                { sigla: 'ap', nome: 'Amapá' },
                { sigla: 'ro', nome: 'Rondônia' },
                { sigla: 'rr', nome: 'Roraima' },
                { sigla: 'to', nome: 'Tocantins' }
            ]
        };

        function selecionarRegiao(codigoRegiao) {
            // Atualiza visual dos botões de região
            document.querySelectorAll('.btn-regiao').forEach(btn => btn.classList.remove('ativa'));
            event.target.classList.add('ativa');

            // Monta os botões dos estados pertencentes àquela região
            const listaEstados = DADOS_REGIOES[codigoRegiao] || [];
            const containerEstados = document.getElementById('container-estados');
            containerEstados.innerHTML = '<span class="estados-label">Unidade:</span>';

            listaEstados.forEach((est, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-uf' + (index === 0 ? ' ativa' : '');
                btn.textContent = est.sigla.toUpperCase();
                btn.title = est.nome;
                btn.onclick = () => {
                    document.querySelectorAll('.btn-uf').forEach(b => b.classList.remove('ativa'));
                    btn.classList.add('ativa');
                    mudarUF(est.sigla, est.nome);
                };
                containerEstados.appendChild(btn);
            });

            // Seleciona automaticamente o primeiro estado da região escolhida
            if (listaEstados.length > 0) {
                mudarUF(listaEstados[0].sigla, listaEstados[0].nome);
            }
        }

        function mudarUF(sigla, nomeCompleto) {
            ufAtiva = sigla;
            document.getElementById('txt-local').textContent = nomeCompleto;
            document.getElementById('info-local-texto').textContent = nomeCompleto;
            carregarDados();
        }

        async function carregarDados() {
            try {
                const res = await fetch(WORKER_2T_URL + "?uf=" + ufAtiva);
                if (!res.ok) throw new Error("Falha na consulta");
                const dados = await res.json();
                renderizar(dados);
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
            }
        }

        function renderizar(dados) {
            const andamento = dados.andamento || "0,00";
            document.getElementById("pct-apurado").textContent = andamento + "%";
            document.getElementById("hora-tse").textContent = dados.dataHora || "00:00:00";
            document.getElementById("info-status-urnas").textContent = andamento === "100,00" ? "Totalização concluída" : `Apuração em andamento (${andamento}%)`;

            const container = document.getElementById("container-finalistas");
            container.innerHTML = "";

            const finalistas = (dados.candidatos || []).slice(0, 2);

            finalistas.forEach(cand => {
                let selo = "";
                if (cand.eleito === "E") {
                    selo = "<span class='selo-status eleito'>Eleito</span>";
                } else if (cand.eleito === "MAT_ELEITO") {
                    selo = "<span class='selo-status eleito'>Matematicamente Eleito</span>";
                }

                const card = `
                    <div class="card-finalista">
                        <div class="perfil-topo">
                            <img src="${cand.foto}" class="foto-finalista" alt="${cand.nomeUrna}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'%238892a4\'><circle cx=\'12\' cy=\'8\' r=\'4\'/><path d=\'M12 14c-5 0-8 2.5-8 5v1h16v-1c0-2.5-3-5-8-5z\'/></svg>'">
                            <div>
                                <h2 class="nome-finalista">${cand.nomeUrna}</h2>
                                <span class="tag-partido">${cand.partido} | nº ${cand.numero}</span>
                                ${selo}
                            </div>
                        </div>
                        <div class="bloco-votos">
                            <div class="pct-votos">${cand.votos.porcentagem}%</div>
                            <div class="abs-votos">${cand.votos.quantidade.toLocaleString('pt-BR')} votos</div>
                            <div class="barra-wrap">
                                <div class="barra-fill" style="width: ${String(cand.votos.porcentagem).replace(',', '.')}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        carregarDados();
        setInterval(carregarDados, 60000);
    </script>
</body>
</html>
